name: Build watch face APK
on:
  push:
    paths: ["watchface/**", ".github/workflows/build-watchface.yml"]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.10.2" }
      - name: Build
        run: gradle -p watchface assembleDebug assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: kgh-neon-ring-apk
          path: watchface/app/build/outputs/apk/**/*.apk
